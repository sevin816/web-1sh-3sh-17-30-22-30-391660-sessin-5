<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استخدام</title>
</head>
<body>
    <header>
        <h1 style="text-align: center;">Employment</h1>
        <hr>
        
    <nav>
        <ul>
            <li><a href="#home">Home</a></li>
            <li><a href="#products">Products</a></li>
            <li><a href="#about">About</a></li>
            <li><a href="#contact">Contact</a></li>
            <li><a href="https://www.instagram.com/" target="_blank">Instagram</a></li>
        </ul>
    </nav>
    <hr>


    </header>
    <main style="text-align: center;">
        <label for="national-id">کد ملی:</label>
        <input type="text" id="national-id" name="national_id" maxlength="10" placeholder="کد ملی خود را وارد کنید">
        <hr>
    <div>
        <h1>Job Application Form</h1>
        <hr>
        <form action="" method="post">
        <details>
            <summary>Personal Information</summary>
            <table border="1" style="text-align: center;">
                <thead>
                    <tr>
                        <th>Information</th>
                        <th>Applicant answer</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>
                            <label for="fullname">Full Name:</label>
                        </td>
                        
                        <td>
                            <input type="text" id="fullname" name="fullname" required>
                        </td>
                    </tr>
                    
                    <tr>
                        <td>
                            <label for="email">Email:</label>
                        </td>
                        
                        <td>
                            <input type="email" id="email" name="email" required>
                        </td>
                    </tr>
                    <tr>
                        <td>
                            <label for="phone">Phone Number:</label>
                        </td>
                        
                        <td>
                            <input type="tel" id="phone" name="Phone number" required>
                        </td>
                    </tr>
                    
                    <tr>
                        <td>
                            <label for="birthdate">Birth Date:</label>
                        </td>
                        
                        <td>
                            <input type="date" id="birthdate" name="birthdate" required>
                        </td>
                    </tr>
                    
                    <tr>
                        <td>
                            <label>Gender:</label>
                        </td>
                        
                        <td>
                            <input type="radio" id="male" name="gender" value="male" required>
                            <label for="male">Male</label>
                            
                            <input type="radio" id="female" name="gender" value="female" required>
                            <label for="female">Female</label>
                        </td>
                    </tr>
                    <tr>
                        <td>
                            <label>Skills:</label>
                        </td>
                        
                        <td>
                            
                            <input type="checkbox" id="Html" name="skills" value="Html">
                            <label for="html">HTML</label>
                            
                            <input type="checkbox" id="css" name="skills" value="css">
                            <label for="css">CSS</label>
                            
                        </td>
                    </tr>

                    <tr>
                        <td>
                            <label>Marital status :</label>
                        </td>
                        <td>
                            <input type="radio" id="single" name="material-status">
                            <label for="single">Single</label>
                            <input type="radio" id="married" name="material-status">
                            <label for="married">Married</label>
                        </td>
                    </tr>
                    <tr>
                        <td colspan="2">
                            <p align="center">
                                <input type="submit" value="submit">
                            </p>
                        </td>
                    </tr>
                </tbody>
                
            </table>
        </form>
    </details>
    </div>
    </main>
    <footer>
        <a href="https://www.linkedin.com">Visit our LinkedIn</a>
    </footer>
    
</body>
</html>
